<style>
/* Layout: a 16:9 slide. Portraits are placed by hand in container units (cqw), so the whole composition scales with the slide. */
:root {
  color-scheme: dark;
  /* Brand (STYLE.md): --main = main branch and primary actions, --accent = anything an agent did. */
  --ground: #292929;
  --main: #76A7DB;
  --accent: #A78BFA;
  --second: #EDEDED;
  --warn: #F0A0A6;
  --rule: color-mix(in srgb, var(--second) 7%, var(--ground));
  --frame: color-mix(in srgb, var(--second) 30%, var(--ground));
  --dim: color-mix(in srgb, var(--second) 64%, var(--ground));
  /* Name and title plates: darker than the page so text and lines never mix. A blend of black into --ground, like the other derived tokens. */
  --plate: color-mix(in srgb, #000 55%, var(--ground));
  /* Lane colours (STYLE.md): decoration only, they mean nothing. Blue and violet carry meaning, and pink and cyan sit too close to them, so all four are left out. */
  --lane-orange: #e0953f; --lane-green: #3fb58a; --lane-red: #e0605a; --lane-grey: #9aa3b2;
  --sans: "Chivo", "Segoe UI", system-ui, sans-serif;
  --mono: "Chivo Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--ground); color: var(--second); font-family: var(--sans); display: grid; place-items: center; overflow: hidden; }
.slide { container-type: inline-size; position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; overflow: hidden;
  background:
    radial-gradient(ellipse 40cqw 28cqw at 20% 32%, color-mix(in srgb, var(--second) 4.5%, transparent), transparent 70%),
    radial-gradient(ellipse 36cqw 26cqw at 80% 70%, color-mix(in srgb, var(--second) 3.5%, transparent), transparent 70%),
    var(--ground); }

.vine { position: absolute; inset: 0; width: 100%; height: 100%; }
.vine path { fill: none; stroke-linecap: round; }
.vine .lane.main { stroke: var(--main); stroke-width: 0.26; opacity: 1; }
/* Commit dots, as drawn in the app's graph: solid in the lane colour, merges as hollow rings, agent commits violet. */
.vine .c { stroke-width: 0.3; }
.vine .c.main { fill: var(--main); stroke: var(--main); }
.vine .c.green { fill: var(--lane-green); stroke: var(--lane-green); }
.vine .c.orange { fill: var(--lane-orange); stroke: var(--lane-orange); }
.vine .c.agent { fill: var(--accent); stroke: var(--accent); }
.vine .c.merge { fill: var(--ground); stroke: var(--main); stroke-width: 0.38; }
.vine .lane.green { stroke: var(--lane-green); stroke-width: 0.22; opacity: 1; }
.vine .lane.orange { stroke: var(--lane-orange); stroke-width: 0.22; opacity: 1; }

.title { position: absolute; z-index: 5; left: 5cqw; top: 4.2cqw; margin: 0; padding: 1cqw 1.4cqw 1.1cqw; background: var(--plate); border-radius: 0.9cqw; color: var(--second); font-size: 3.4cqw; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
.title small { display: block; margin-top: 0.7cqw; font: 500 1.05cqw var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--second); }

/* Each person: position (x, y = centre), size, tilt, and a different organic outline. */
.person { position: absolute; left: calc(var(--x) * 1cqw); top: calc(var(--y) * 1cqw); width: calc(var(--s) * 1cqw); aspect-ratio: 1;
  transform: translate(-50%, -50%) rotate(var(--r)); margin: 0; animation: drift var(--t, 9s) ease-in-out infinite alternate; animation-delay: var(--d, 0s); }
.person .shape { position: absolute; inset: 0; border-radius: var(--b); overflow: hidden; background: var(--ground);
  box-shadow: 0 1.2cqw 2.6cqw rgb(0 0 0 / 0.45); }
.person img { width: 100%; height: 100%; object-fit: cover; display: block; transform: rotate(calc(var(--r) * -1)) scale(1.12); }
/* An offset outline in a different blob, like a second print that did not quite register. */
.person::before { content: ""; position: absolute; inset: -0.9cqw; border-radius: var(--b2); border: 0.24cqw solid var(--ring, var(--lane-grey)); opacity: 0.95; transform: rotate(var(--r2)) translate(var(--ox), var(--oy)); }
.person figcaption { position: absolute; z-index: 4; left: 50%; top: calc(100% + 1cqw); transform: translateX(-50%) rotate(calc(var(--r) * -0.6)); white-space: nowrap;
  padding: 0.38cqw 1cqw 0.42cqw; background: var(--plate); border-radius: 0.55cqw; color: var(--second); font: 500 1.2cqw var(--mono); letter-spacing: 0.04em; }

@keyframes drift { from { translate: 0 -0.35cqw; } to { translate: 0.25cqw 0.35cqw; } }
@media (prefers-reduced-motion: reduce) { .person { animation: none; } }
</style>
